name: Python Lint
on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  security-events: write
jobs:
  lint:
    name: Python ${{ matrix.python-version }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v6

      - name: Build backend container
        run: |
          docker compose -f docker-compose.test.yml build backend_test

      - name: Ruff
        run: |
          docker compose -f docker-compose.test.yml run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            backend_test \
            sh -lc 'cd backend && python -m pip install -r requirements.test.txt && cd .. && ruff check .'

      - name: Ruff SARIF
        if: always()
        run: |
          docker compose -f docker-compose.test.yml run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            backend_test \
            sh -lc 'cd backend && python -m pip install -r requirements.test.txt && cd .. && ruff check --output-format sarif . > ruff.sarif || true'

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ruff.sarif

      - name: Clean up
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down --volumes --remove-orphans
