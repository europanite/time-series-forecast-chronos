[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ts-forecast"
version = "0.1.0"
description = "Docker Compose based local time-series forecasting with Chronos-2 and TimesFM."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ts-forecast = "local_ts_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
