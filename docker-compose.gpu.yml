# 使い方:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm forecast ...
# 前提:
#   NVIDIA Container Toolkit が入っていること。
services:
  forecast:
    environment:
      DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    environment:
      DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
